<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feynman-GCPN Training Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        #canvas {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 1px solid #475569;
            transition: transform 0.2s;
        }
        
        .metric-card:hover {
            transform: translateY(-2px);
        }
        
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">🤖 Feynman-GCPN Training Monitor</h1>
            <p class="text-slate-400">Real-time visualization of RL agent learning to generate Feynman diagrams</p>
        </div>

        <!-- Control Panel -->
        <div class="bg-slate-800 rounded-lg p-6 mb-6 border border-slate-700">
            <div class="flex items-center gap-4">
                <button id="btn-refresh" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors">
                    🔄 Refresh Now
                </button>
                
                <label class="flex items-center gap-2 text-white">
                    <input type="checkbox" id="auto-refresh" checked class="w-4 h-4">
                    <span>Auto-refresh every 2s</span>
                </label>
                
                <div class="ml-auto flex items-center gap-2">
                    <span class="text-slate-400">Status:</span>
                    <div id="status" class="px-3 py-1 rounded-full bg-green-900 text-green-300 text-sm pulse">
                        ● Monitoring
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- Metrics -->
            <div class="metric-card rounded-lg p-6">
                <div class="text-slate-400 text-sm mb-1">Current Episode</div>
                <div id="episode" class="text-3xl font-bold text-white">0</div>
            </div>
            
            <div class="metric-card rounded-lg p-6">
                <div class="text-slate-400 text-sm mb-1">Latest Reward</div>
                <div id="reward" class="text-3xl font-bold text-emerald-400">0.00</div>
            </div>
            
            <div class="metric-card rounded-lg p-6">
                <div class="text-slate-400 text-sm mb-1">Diagram Complexity</div>
                <div id="complexity" class="text-3xl font-bold text-blue-400">0</div>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="bg-slate-800 rounded-lg p-6 border border-slate-700 mb-6">
            <div class="mb-4">
                <h2 class="text-xl font-bold text-white mb-2">Current Best Diagram</h2>
                <div id="reaction-info" class="text-slate-400 text-sm">
                    Reaction: <span id="reaction-latex" class="font-mono">Loading...</span>
                </div>
            </div>
            
            <div class="flex justify-center">
                <canvas id="canvas" width="800" height="600"></canvas>
            </div>
            
            <div id="error-message" class="mt-4 text-red-400 text-sm hidden"></div>
        </div>

        <!-- Training Progress -->
        <div class="bg-slate-800 rounded-lg p-6 border border-slate-700">
            <h2 class="text-xl font-bold text-white mb-4">Training History</h2>
            <div id="history-container" class="space-y-2 max-h-64 overflow-y-auto">
                <div class="text-slate-500 text-sm">Waiting for training data...</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            diagramPath: 'diagrams/current_best.json',
            autoRefreshInterval: 2000,
            canvasWidth: 800,
            canvasHeight: 600
        };

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;

        // State
        let currentDiagram = null;
        let autoRefreshTimer = null;

        // Initialize
        function init() {
            setupEventListeners();
            if (document.getElementById('auto-refresh').checked) {
                startAutoRefresh();
            }
            loadDiagram();
        }

        function setupEventListeners() {
            document.getElementById('btn-refresh').addEventListener('click', loadDiagram);
            document.getElementById('auto-refresh').addEventListener('change', (e) => {
                if (e.target.checked) {
                    startAutoRefresh();
                } else {
                    stopAutoRefresh();
                }
            });
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            autoRefreshTimer = setInterval(loadDiagram, CONFIG.autoRefreshInterval);
        }

        function stopAutoRefresh() {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }
        }

        async function loadDiagram() {
            try {
                const response = await fetch(CONFIG.diagramPath + '?t=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: File not found`);
                }
                
                const data = await response.json();
                currentDiagram = data;
                
                updateMetrics(data);
                drawDiagram(data.shapes || []);
                hideError();
                
            } catch (error) {
                console.error('Failed to load diagram:', error);
                showError(`Failed to load diagram: ${error.message}. Make sure training is running.`);
            }
        }

        function updateMetrics(data) {
            const metadata = data.metadata || {};
            
            document.getElementById('episode').textContent = metadata.episode || 0;
            document.getElementById('reward').textContent = (metadata.reward || 0).toFixed(2);
            document.getElementById('complexity').textContent = (data.shapes || []).length;
            
            if (metadata.initial_state && metadata.final_state) {
                const reactionStr = `${metadata.initial_state.join(' + ')} → ${metadata.final_state.join(' + ')}`;
                document.getElementById('reaction-latex').textContent = reactionStr;
            }
            
            addHistoryEntry(metadata);
        }

        function addHistoryEntry(metadata) {
            const container = document.getElementById('history-container');
            
            // Clear placeholder
            if (container.children.length === 1 && container.children[0].textContent.includes('Waiting')) {
                container.innerHTML = '';
            }
            
            const entry = document.createElement('div');
            entry.className = 'flex justify-between items-center p-3 bg-slate-700 rounded-lg text-sm';
            entry.innerHTML = `
                <span class="text-slate-300">Episode ${metadata.episode || 0}</span>
                <span class="text-emerald-400 font-mono">Reward: ${(metadata.reward || 0).toFixed(2)}</span>
                <span class="text-slate-400">${new Date().toLocaleTimeString()}</span>
            `;
            
            container.insertBefore(entry, container.firstChild);
            
            // Keep only last 20 entries
            while (container.children.length > 20) {
                container.removeChild(container.lastChild);
            }
        }

        function drawDiagram(shapes) {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw boundary lines
            drawBoundaryLines();
            
            // Draw shapes
            shapes.forEach(shape => drawShape(shape));
            
            if (shapes.length === 0) {
                // Show "no diagram" message
                ctx.fillStyle = '#64748b';
                ctx.font = '16px Inter';
                ctx.textAlign = 'center';
                ctx.fillText('No diagram generated yet', canvas.width / 2, canvas.height / 2);
            }
        }

        function drawBoundaryLines() {
            const initialX = 80;
            const finalX = canvas.width - 80;
            
            ctx.save();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            
            // Initial state line
            ctx.beginPath();
            ctx.moveTo(initialX, 0);
            ctx.lineTo(initialX, canvas.height);
            ctx.stroke();
            
            // Final state line
            ctx.beginPath();
            ctx.moveTo(finalX, 0);
            ctx.lineTo(finalX, canvas.height);
            ctx.stroke();
            
            ctx.setLineDash([]);
            ctx.restore();
        }

        function drawShape(shape) {
            const p1 = shape.p1;
            const p2 = shape.p2;
            
            ctx.save();
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            
            // Color based on type
            let color = '#94a3b8';
            if (shape.type === 'fermion') color = '#34d399';
            if (shape.type === 'photon') color = '#fbbf24';
            if (shape.type === 'boson_w') color = '#fb923c';
            if (shape.type === 'gluon') color = '#ec4899';
            
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            
            ctx.translate(p1.x, p1.y);
            ctx.rotate(angle);
            
            // Draw based on type
            if (shape.type === 'fermion') {
                // Straight line with arrow
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(dist, 0);
                ctx.stroke();
                
                // Arrow
                const arrowSize = 10;
                const arrowPos = dist * 0.5;
                ctx.beginPath();
                ctx.moveTo(arrowPos + arrowSize * 0.5, 0);
                ctx.lineTo(arrowPos - arrowSize * 0.5, -arrowSize / 2);
                ctx.lineTo(arrowPos - arrowSize * 0.5, arrowSize / 2);
                ctx.closePath();
                ctx.fill();
                
            } else if (shape.type === 'photon') {
                // Wavy line
                ctx.beginPath();
                const wavelength = 20;
                const amplitude = 8;
                const numWaves = Math.floor(dist / wavelength);
                
                ctx.moveTo(0, 0);
                for (let i = 0; i <= numWaves * 10; i++) {
                    const x = (i / 10) * wavelength;
                    const y = amplitude * Math.sin(i * Math.PI / 5);
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
                
            } else {
                // Default: straight line
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(dist, 0);
                ctx.stroke();
            }
            
            ctx.restore();
            
            // Label
            const symbol = shape.props?.particleId || '?';
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            ctx.fillText(symbol, midX, midY - 10);
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('hidden');
        }

        // Start
        init();
    </script>
</body>
</html>
