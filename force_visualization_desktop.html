<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子物理可视化：五大核心要素</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            user-select: none; 
            overflow: hidden;
        }
        canvas {
            image-rendering: -webkit-optimize-contrast;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .btn-press:active { 
            transform: scale(0.96); 
        }
    </style>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- 标题栏 -->
    <header class="flex-none px-6 py-3 bg-gray-900/80 backdrop-blur-md border-b border-gray-800 z-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button id="btn-back" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm font-medium transition-all border border-slate-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                <span id="back-text">返回费曼图</span>
            </button>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
                <span id="main-title">粒子物理可视化</span>
            </h1>
        </div>
        
        <button id="btn-lang-viz" class="flex items-center gap-2 px-3 py-1.5 text-slate-400 hover:text-cyan-400 transition-colors border border-slate-700 rounded">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
            </svg>
            <span id="lang-viz-text">中文</span>
        </button>
    </header>

    <!-- 主内容区 -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Canvas 区域 -->
        <div class="flex-1 bg-black relative overflow-hidden group">
            <canvas id="vis-canvas" class="absolute inset-0 w-full h-full block"></canvas>
            
            <!-- 悬浮标签 -->
            <div class="absolute top-6 left-6 px-4 py-2 rounded-xl bg-gray-800/90 backdrop-blur border border-gray-700 shadow-2xl pointer-events-none z-10">
                 <span id="floating-label" class="text-lg font-bold text-white tracking-wide">Strong Force</span>
            </div>

            <!-- 交互提示 (仅希格斯显示) -->
            <div id="interaction-hint" class="hidden absolute bottom-8 left-0 right-0 text-center text-sm text-purple-300/70 animate-pulse pointer-events-none">
                <span id="hint-text">点击屏幕激发希格斯玻色子</span>
            </div>
        </div>

        <!-- 右侧信息面板 -->
        <div class="w-96 bg-gray-900 border-l border-gray-800 flex flex-col overflow-hidden">
            
            <!-- 控制按钮 -->
            <div class="flex-none p-4 border-b border-gray-800">
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-strong" class="force-btn-desktop">
                        <span class="w-4 h-4 rounded-full bg-red-500"></span>
                        <span id="force-strong">强核力</span>
                    </button>
                    <button id="btn-em" class="force-btn-desktop">
                        <span class="w-4 h-4 rounded-full bg-blue-500"></span>
                        <span id="force-em">电磁力</span>
                    </button>
                    <button id="btn-weak" class="force-btn-desktop">
                        <span class="w-4 h-4 rounded-full bg-yellow-500"></span>
                        <span id="force-weak">弱核力</span>
                    </button>
                    <button id="btn-gravity" class="force-btn-desktop">
                        <span class="w-4 h-4 rounded-full bg-green-500"></span>
                        <span id="force-gravity">引力</span>
                    </button>
                    <button id="btn-higgs" class="force-btn-desktop col-span-2">
                        <span class="w-4 h-4 rounded-full bg-purple-500"></span>
                        <span id="force-higgs">希格斯机制</span>
                    </button>
                </div>
            </div>

            <!-- 信息卡片 -->
            <div class="flex-1 p-6 space-y-5 overflow-y-auto custom-scrollbar">
                <div>
                    <h2 id="info-title" class="text-2xl font-bold text-white mb-3"></h2>
                    <p id="info-description" class="text-gray-400 leading-relaxed text-base"></p>
                </div>
                
                <div class="grid grid-cols-1 gap-4">
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase tracking-wider mb-2" id="label-strength">相对强度/性质</div>
                        <div id="info-strength" class="text-xl font-mono font-bold text-gray-200"></div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase tracking-wider mb-2" id="label-range">作用范围</div>
                        <div id="info-range" class="text-base font-medium text-gray-200"></div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase tracking-wider mb-2" id="label-particle">媒介粒子 / 场粒子</div>
                        <div id="info-particle" class="text-base font-medium text-cyan-300"></div>
                    </div>
                </div>
                
                <!-- 额外信息 -->
                <div class="bg-gradient-to-br from-cyan-900/20 to-purple-900/20 p-4 rounded-xl border border-cyan-700/30">
                    <div class="text-xs text-cyan-400 uppercase tracking-wider mb-2" id="label-note">提示</div>
                    <div class="text-sm text-gray-300" id="info-note">
                        <!-- 动态填充 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="force-viz-logic.js"></script>
</body>
</html>
