<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Feynman Forge: 物理守恒终极版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            touch-action: none; 
            margin: 0;
            padding: 0;
            height: 100vh;
            max-height: 100vh;
        }
        canvas { touch-action: none; }
        .tool-btn.active { @apply bg-cyan-900/50 border-cyan-400 text-cyan-300; box-shadow: 0 0 10px rgba(34,211,238,0.2); }
        .snap-ring { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
        
        /* PC端优化 - 防止被任务栏遮挡 */
        @media (min-width: 768px) {
            body {
                padding: 0;
            }
            #main-canvas {
                cursor: crosshair;
            }
            /* 滚动条优化 */
            .custom-scrollbar::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: #1e293b;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #475569;
                border-radius: 3px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: #64748b;
            }
        }
        
        /* 移动端优化 */
        @media (max-width: 767px) {
            body {
                height: 100dvh;
                max-height: 100dvh;
            }
        }
    </style>
    <script>
        // Wait for tailwind to load before configuring
        if (typeof tailwind !== 'undefined') {
            tailwind.config = { darkMode: 'class' };
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-200 flex flex-col" style="height: 100vh; max-height: 100vh;">

    <header class="flex-none h-12 md:h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 md:px-4 z-20 flex-shrink-0">
        <div class="flex items-center gap-2">
            <button id="btn-back-to-start" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm font-medium transition-all border border-slate-700">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span data-i18n="back-to-home">返回主页</span>
            </button>
            <i data-lucide="atom" class="text-cyan-400 w-5 h-5 ml-2"></i>
            <h1 class="font-bold text-slate-100">Feynman<span class="text-cyan-400">Forge</span> <span class="text-xs text-slate-500 font-mono">v4.0</span></h1>
        </div>
        <div class="flex gap-2 items-center">
             <div class="hidden md:flex items-center gap-1 text-xs text-slate-500 px-3 py-1 bg-slate-800 rounded border border-slate-700">
                <span data-i18n="time-label">时间 Time</span>
                <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </div>
            <div class="hidden lg:flex items-center gap-2 text-xs text-slate-500 px-2 py-1">
                <span class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono">Del</span>
                <span data-i18n="del-hint">删除</span>
                <span class="mx-1">|</span>
                <span class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono">Esc</span>
                <span data-i18n="esc-hint">取消</span>
            </div>
            <button id="btn-lang" class="flex items-center gap-2 px-3 py-1.5 text-slate-400 hover:text-cyan-400 transition-colors border border-slate-700 rounded">
                <i data-lucide="languages" class="w-5 h-5"></i>
                <span id="lang-text">中文</span>
            </button>
            <button id="btn-help" class="hidden md:flex items-center gap-1 px-2 py-1 text-slate-400 hover:text-cyan-400 transition-colors" title="物理规则说明">
                <i data-lucide="help-circle" class="w-4 h-4"></i>
            </button>
            <button id="btn-validate" class="flex items-center gap-1 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-bold transition-all shadow-lg shadow-indigo-500/20">
                <i data-lucide="shield-check" class="w-3 h-3"></i> <span class="hidden md:inline" data-i18n="validate-text">验证守恒</span><span class="md:hidden" data-i18n="validate-short">验证</span>
            </button>
            <button id="btn-clear" class="p-1.5 text-slate-400 hover:text-red-400 transition-colors" title="清空画布或删除选中项"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
    </header>

    <div class="flex-1 relative overflow-hidden bg-[#0B0F19] cursor-crosshair" style="min-height: 0;">
        <div class="absolute inset-0 opacity-10 pointer-events-none" 
             style="background-image: radial-gradient(#4f4f4f 1px, transparent 1px); background-size: 20px 20px;">
        </div>
        
        <div class="absolute bottom-3 md:bottom-4 left-3 md:left-4 text-slate-700 text-xs md:text-sm font-mono select-none pointer-events-none opacity-50">
            Time --------------------->
        </div>

        <canvas id="main-canvas" class="block w-full h-full"></canvas>
        
        <div id="snap-indicator" class="hidden absolute w-4 h-4 border-2 border-yellow-400 rounded-full -translate-x-1/2 -translate-y-1/2 pointer-events-none z-30"></div>
        
        <div id="error-layer" class="absolute inset-0 pointer-events-none"></div>
    </div>

    <div id="toast" class="fixed top-16 md:top-20 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 text-white px-4 py-2 rounded-lg text-sm shadow-xl z-50 transition-all duration-300 opacity-0 -translate-y-10 pointer-events-none max-w-md">
        <span id="toast-message"></span>
    </div>

    <div id="help-panel" class="hidden fixed top-20 right-4 w-96 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl z-50 p-4 max-h-[80vh] overflow-y-auto custom-scrollbar">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-cyan-400 flex items-center gap-2">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                <span data-i18n="help-title">物理守恒定律完整版</span>
            </h3>
            <button id="btn-close-help" class="text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div id="help-content" class="space-y-2 text-xs">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <div id="prop-panel" class="flex-none bg-slate-900 border-t border-slate-800 p-0 transition-all z-20 flex flex-col h-auto md:h-auto flex-shrink-0">
        
        <div class="flex flex-row overflow-x-auto gap-2 p-2 border-b border-slate-800 items-center justify-start custom-scrollbar">
            <button class="tool-btn active w-12 h-12 md:w-14 md:h-14 flex-shrink-0 rounded-lg border border-transparent flex flex-col items-center justify-center hover:bg-slate-800 transition-colors" data-tool="select">
                <i data-lucide="mouse-pointer-2" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1" data-i18n="tool-select">选择</span>
            </button>
            <div class="w-px h-8 bg-slate-800"></div>
            
            <button class="tool-btn w-12 h-12 md:w-14 md:h-14 flex-shrink-0 rounded-lg border border-transparent flex flex-col items-center justify-center group hover:bg-slate-800 transition-colors" data-tool="fermion">
                <div class="relative w-6 h-6">
                    <svg class="absolute inset-0 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="0" y1="12" x2="24" y2="12"/><path d="M14 8l4 4-4 4"/></svg>
                </div>
                <span class="text-[9px] mt-1 text-emerald-400" data-i18n="tool-fermion">费米子</span>
            </button>

            <button class="tool-btn w-12 h-12 md:w-14 md:h-14 flex-shrink-0 rounded-lg border border-transparent flex flex-col items-center justify-center hover:bg-slate-800 transition-colors" data-tool="photon">
                <svg class="w-6 h-6 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c2-4 4-4 5 0s3 4 5 0s3-4 5 0s3 4 5 0"/></svg>
                <span class="text-[9px] mt-1 text-yellow-400" data-i18n="tool-photon">光子</span>
            </button>

            <button class="tool-btn w-12 h-12 md:w-14 md:h-14 flex-shrink-0 rounded-lg border border-transparent flex flex-col items-center justify-center hover:bg-slate-800 transition-colors" data-tool="boson_w">
                <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12l2-3 2 3 2-3 2 3 2-3 2 3 2-3 2 3 2-3 2 3"/></svg>
                <span class="text-[9px] mt-1 text-orange-400" data-i18n="tool-w">W±</span>
            </button>
            
            <button class="tool-btn w-12 h-12 md:w-14 md:h-14 flex-shrink-0 rounded-lg border border-transparent flex flex-col items-center justify-center hover:bg-slate-800 transition-colors" data-tool="boson_z">
                <svg class="w-6 h-6 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12l2-3 2 3 2-3 2 3 2-3 2 3 2-3 2 3 2-3 2 3"/></svg>
                <span class="text-[9px] mt-1 text-blue-400" data-i18n="tool-z">Z⁰</span>
            </button>
            
            <button class="tool-btn w-12 h-12 md:w-14 md:h-14 flex-shrink-0 rounded-lg border border-transparent flex flex-col items-center justify-center hover:bg-slate-800 transition-colors" data-tool="gluon">
                 <svg class="w-6 h-6 text-pink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c1-3 3-3 4 0s3 3 4 0s3-3 4 0s3 3 4 0"/></svg>
                <span class="text-[9px] mt-1 text-pink-400" data-i18n="tool-gluon">胶子</span>
            </button>
            
            <button class="tool-btn w-12 h-12 md:w-14 md:h-14 flex-shrink-0 rounded-lg border border-transparent flex flex-col items-center justify-center hover:bg-slate-800 transition-colors" data-tool="higgs">
                 <svg class="w-6 h-6 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><line x1="0" y1="12" x2="24" y2="12"/></svg>
                <span class="text-[9px] mt-1 text-purple-400" data-i18n="tool-higgs">希格斯</span>
            </button>
        </div>

        <div class="flex-1 p-3 md:p-4 flex flex-col gap-3 overflow-y-auto custom-scrollbar" style="max-height: 200px;">
            <div id="empty-state" class="text-slate-500 text-xs md:text-sm flex items-center justify-center h-full py-4" data-i18n="empty-state-text">
                请选择工具开始绘制，靠近端点自动吸附。
            </div>
            
            <div id="settings-fermion" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1" data-i18n="label-family">粒子族 (Family)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="fam-btn px-2 py-2 bg-slate-800 rounded text-xs hover:bg-slate-700 border border-slate-700 active" data-fam="lepton" data-i18n="family-lepton">轻子</button>
                        <button class="fam-btn px-2 py-2 bg-slate-800 rounded text-xs hover:bg-slate-700 border border-slate-700" data-fam="quark_u" data-i18n="family-quark-u">上型夸克</button>
                        <button class="fam-btn px-2 py-2 bg-slate-800 rounded text-xs hover:bg-slate-700 border border-slate-700" data-fam="quark_d" data-i18n="family-quark-d">下型夸克</button>
                    </div>
                    
                    <label class="block text-xs font-bold text-slate-500 mt-3 mb-1" data-i18n="label-particle">具体粒子</label>
                    <select id="sel-particle" class="w-full bg-slate-800 border border-slate-600 text-white text-sm rounded px-2 py-1">
                        </select>
                    
                    <div id="color-selector" class="hidden mt-3">
                        <label class="block text-xs font-bold text-slate-500 mb-1" data-i18n="label-color">色荷 (Color)</label>
                        <select id="sel-color" class="w-full bg-slate-800 border border-slate-600 text-white text-xs rounded px-2 py-1">
                            <option value="red" data-i18n="color-red">红 (Red)</option>
                            <option value="green" data-i18n="color-green">绿 (Green)</option>
                            <option value="blue" data-i18n="color-blue">蓝 (Blue)</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex flex-col gap-2">
                    <div class="bg-slate-800 p-2 rounded border border-slate-700 flex-1">
                        <div class="text-xs text-slate-500 mb-1" data-i18n="label-conservation">守恒量</div>
                        <div class="flex justify-between text-xs font-mono">
                            <span class="text-slate-400" data-i18n="charge">Q(电荷):</span>
                            <span id="preview-q" class="text-cyan-400">0</span>
                        </div>
                        <div class="flex justify-between text-xs font-mono">
                            <span class="text-slate-400" data-i18n="lepton">L(轻子数):</span>
                            <span id="preview-l" class="text-emerald-400">0</span>
                        </div>
                        <div class="flex justify-between text-xs font-mono">
                            <span class="text-slate-400" data-i18n="baryon">B(重子数):</span>
                            <span id="preview-b" class="text-purple-400">0</span>
                        </div>
                        <div class="flex justify-between text-xs font-mono mt-1 pt-1 border-t border-slate-700">
                            <span class="text-slate-400" data-i18n="spin">自旋:</span>
                            <span id="preview-spin" class="text-orange-400">0</span>
                        </div>
                        <div class="flex justify-between text-xs font-mono">
                            <span class="text-slate-400" data-i18n="parity">宇称:</span>
                            <span id="preview-parity" class="text-pink-400">+1</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="settings-boson" class="hidden">
                <label class="block text-xs font-bold text-slate-500 mb-1" data-i18n="label-boson">玻色子类型</label>
                <div class="flex gap-2" id="boson-type-container">
                    </div>
                
                <div id="gluon-color-selector" class="hidden mt-3">
                    <label class="block text-xs font-bold text-slate-500 mb-1" data-i18n="label-gluon-color">胶子色荷组合</label>
                    <select id="sel-gluon-color" class="w-full bg-slate-800 border border-slate-600 text-white text-xs rounded px-2 py-1">
                        </select>
                </div>
                
                <div class="mt-2 text-xs text-slate-400" id="boson-desc"></div>
            </div>
        </div>
    </div>

    <script src="feynman-logic.js"></script>
</body>
</html>
